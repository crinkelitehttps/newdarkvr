[xinput_joy]
enabled=1

; Which XInput pad slot to read (0-3). Restart to change.
xinput_index=0

; 0 = quiet, 1 = call summary (default), 2 = full struct hex dumps -- use 2 for Phase-0 discovery,
; then turn it back down once things work (dinput.log grows fast at level 2).
log_verbose=1

; Axis sign flips, if left/forward comes out backwards in testing. Live (reloaded every 2s).
invert_lx=0
invert_ly=0
invert_rx=0

; The "shift" chording button: holding this while another button (or a left-stick direction) is
; pressed gives that input a second, distinct bindable identity in the game's "Customize Controls..."
; screen -- e.g. A alone vs LB+A. One of: LB RB LT RT LeftThumb RightThumb Back Start. Live.
shift_button=LB

; Fraction (0..1) of trigger travel before LT/RT count as "pressed" for button purposes.
trigger_threshold=0.5

; Fraction (0..1) of left-stick travel before a direction counts as a chorded button press (only
; matters while shift_button is held -- otherwise the stick stays pure analog movement).
stick_button_threshold=0.5

; Off by default: the D-pad is the POV hat only (joy_hatup/dn/lt/rt binds). Not yet implemented as an
; alternate button-bank mode -- reserved for a later addition.
dpad_as_buttons=0

; Fraction (0..1) of travel near center that's collapsed to exactly 0, with the remaining travel
; rescaled back to full range -- fixes stick-center drift. Applied by us directly; the engine's own
; joystick_deadzone/rudder_deadzone config vars are not relied on for this. Live.
; Two separate values: the left stick (movement) can tolerate a smaller one since a little residual
; creep barely matters, but the right stick (mouselook, below) usually needs a bigger one -- a slow
; camera drift is much more noticeable than the same amount of movement creep.
stick_deadzone=0.08
mouselook_deadzone=0.15

; This engine's classic joystick support has no analog look/pitch bind at all (only mouselook responds
; to it), so with mouselook_enabled=1 the right stick drives synthetic relative mouse movement (yaw +
; pitch) instead of feeding the joystick R/Z axes -- only while this game's own window has focus.
; mouselook_sensitivity is pixels/poll-tick at full stick deflection -- a rough starting guess, tune
; live to taste. Set mouselook_enabled=0 to go back to the right stick doing nothing but rudderturn
; (its old joy_axisr bind) with no mouse injection. Live.
mouselook_enabled=1
mouselook_sensitivity=18.0
mouselook_invert_y=0

; Buttons that act as keyboard/mouse instead of joystick buttons (they then no longer show up as joy8 / joy7
; in "Customize Controls..."). Work in menus too, only while the game window is in front. Live.
; Back/View (select) = Esc: open/close the game menu.
back_as_escape=1
; Right trigger = left mouse button, held while the trigger is held (attack / draw bow; click in menus).
rt_as_mouse1=1

; Log is always dinput.log next to this DLL (not separately configurable, same as headlook.log).
