; headlook.ini: settings for the Thief II VR mod (headlook.dll), for playing in a SteamVR headset.
; Start the game with run_openvr_1440.bat or run_openvr.bat (they switch VR on). Edits are picked up within
; about 2 seconds while the game runs (only the ports and listen_loopback need a restart). headlook.log, next
; to this file, shows what was read and what happened.
[headlook]
enabled=1

; Head pose from a tracker over UDP (OpenTrack format), used without a headset or with the older hmd_bridge.exe
; route. In headset mode (run_openvr*.bat) the pose comes from SteamVR and this port is ignored.
udp_port=4242
tcp_port=0
; Listen on 127.0.0.1 only: no Windows Firewall prompt, nothing exposed to the network.
listen_loopback=1

; Direction of turning/looking. Leave at -1 unless the view turns the wrong way (in the headset too).
yaw_sign=-1
pitch_sign=-1
roll_sign=1
yaw_gain=1
pitch_gain=1
roll_gain=1

; A headset can turn all the way round and look straight up or down, so the clamps are wide open.
max_yaw=180
max_pitch=89
max_roll=45

; HMD data is already smooth; every millisecond of filter is added lag. Raise it if the view jitters.
smoothing_ms=8
timeout_ms=500
use_roll=0

; Stereo/VR is switched on by the launchers (run_openvr*.bat set HEADLOOK_STEREO=openvr), so starting Thief2.exe
; directly plays normally.
stereo=off
; Eye separation in game units (assumes 1 unit = 1 foot; 6.4 cm = 0.21). Live. Raise it if depth looks flat.
stereo_ipd=0.21
; 1 swaps the two halves if depth looks inside-out. Live.
stereo_swap=0

; Reference ticks for true heading/pitch (see the main headlook.ini for what they mean). Turned off here:
; in a headset the whole view already moves with your head, and with max_yaw/max_pitch this wide the ticks
; would often sit pinned at the screen edge. Set to 1 to try them; fov_deg is an unverified guess either way.
show_heading_marks=0
fov_deg=90

; ---- stereo=openvr (run_openvr.bat) only ----
; View scale the engine draws with in the headset: 0 = automatic (widened to fill the headset's field of view).
; Otherwise 1/tan(half the 4:3 horizontal FOV): 1 = the game's normal 90 deg, smaller = wider. Live.
vr_view_scale=0
; The engine's HDR picture (d3d_disp_enable_hdr) is sent as gamma-encoded colour; 1 sends it as linear light,
; try it if the headset picture looks washed out or too dark next to the monitor. Live.
vr_hdr_linear=0
; Convert the HDR eye image to 8-bit on the GPU before copying it to the headset (half the data to move; the
; headset clamps HDR anyway). 0 = copy the 16-bit image as before (then vr_hdr_linear applies). Live.
vr_gpu_convert=1
; Headset picture brightness: out = black + (1 - black) * in^(1/gamma). The eye images are taken before the
; game's own brightness/gamma correction, so this is where to brighten dark scenes. Higher gamma = brighter
; shadows; vr_black lifts pure black (0..0.5; 0.02-0.05 helps headsets that crush dark greys). Live.
vr_gamma=1.3
vr_black=0
; While the game shows a menu, book or pause screen after a map has been played, keep sending SteamVR the last
; 3D frame (it stays in place in the room). 0 = send nothing (SteamVR then shows its own surroundings). Live.
vr_idle_frames=1
; HUD and menus on a panel fixed in front of you (1) or not at all (0). With it on, the desktop window shows only
; the HUD over black during a mission (the scene goes to the headset). Live.
vr_hud=1
; In a mission the panel shows the HUD, fixed to your head: its width in degrees of view, and how far below
; straight ahead its centre sits (degrees). Refreshed every vr_hud_every-th frame to save time. Live.
vr_hud_deg=45
vr_hud_down=0
vr_hud_every=3
; Show/hide the in-game HUD panel (menus always show): a Windows virtual-key code (72 = H) and an XInput button
; mask (32768 = Y; 0 = none). Live.
vr_hud_key=72
vr_hud_pad=32768
; With the HUD toggled off, keep showing the light gem (1) or hide everything (0). Its part of the screen,
; as fractions of width/height from the top-left (the defaults are a guess at the bottom centre; widen them if
; the gem is cut off, narrow them if other HUD bits show). Live.
vr_gem_always=1
vr_gem_x0=0.40
vr_gem_y0=0.82
vr_gem_x1=0.60
vr_gem_y1=1.00
; Move the game's HUD overlays (health shields, item frame, weapon/item models) from the left eye's picture onto
; the panel: 0 = off (old behaviour), 2 = on (default), 1 = on using the engine's own scene brackets (try it if
; 2 shows nothing). Live.
vr_hud_overlays=2
; Menus and books: fixed in the room where you were looking when they opened. Width and tilt, degrees. Live.
vr_menu_deg=50
vr_menu_down=5
; Distance of both panels, metres. Live.
vr_hud_dist=1.5
