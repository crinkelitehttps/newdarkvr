; headlook.ini: settings for headlook.dll (place next to the DLL in the game folder).
; Edits are picked up within about 2 seconds while the game runs (only the two ports need a restart).
; See headlook.log for what was read and whether the hook installed.
[headlook]
enabled=1

; OpenTrack "UDP over network" output: point it at this machine, port udp_port.
udp_port=4242
; Optional: the same 48-byte records over TCP (for relaying through an ssh tunnel). 0 = off.
tcp_port=4243
; 1 = listen on 127.0.0.1 only (needs a restart). Use it when the tracker program runs on the same machine
; as the game, e.g. tools/hmd_bridge on Windows; it avoids Windows Firewall prompts and LAN exposure.
listen_loopback=0

; Axis direction. In the game a POSITIVE value turns the view left and tilts it down, and OpenTrack's
; raw yaw and pitch come out the opposite way round, so yaw and pitch default to -1. That means you
; leave the "Pre-invert" tickboxes on OpenTrack's Output tab (Options menu) UNTICKED: turning your head
; right turns the view right and looking up looks up.
; If you already have Pre-invert ticked for an axis, either untick it or set that sign to 1 here;
; doing both (or neither) leaves the axis backwards.
; If an axis still moves the wrong way, flip its sign; the change applies live.
; roll_sign has not been tested with a real head (roll is off by default, see use_roll).
yaw_sign=-1
pitch_sign=-1
roll_sign=1

; Degrees of view per degree of head. 1 = 1:1.
yaw_gain=1
pitch_gain=1
roll_gain=1

; Clamp (degrees, either direction).
max_yaw=120
max_pitch=70
max_roll=45

; Low-pass filter time constant in milliseconds (0 = raw). Higher = smoother but laggier.
smoothing_ms=25

; If no data arrives for this long, the view eases back to centre.
timeout_ms=500

; Head roll tilts the view (bank). Off by default: yaw and pitch only for now.
use_roll=0

; ---- Stereo experiment: side-by-side (SBS) --------------------------------------------------------
; Draws the scene twice per frame (one eye each, camera shifted sideways) and squeezes each into half
; the screen. Off by default. The usual way to switch it on is `STEREO=sbs tools/run-wine.sh`, which sets
; the HEADLOOK_STEREO environment variable; that overrides this key. Switching it on or off needs a game
; restart. Use -postprocess=0 (the launcher's default): this copies the render target, not a post-process
; chain. The HUD and menus are drawn afterwards at full width (not yet split per eye).
stereo=off
; Distance between the eyes in game units, live-reloaded. The default assumes 1 unit = 1 foot
; (6.4 cm = 0.21); that scale is a guess, so raise it (0.4, 0.8) if depth looks flat.
stereo_ipd=0.21
; 1 swaps the two halves (for cross-eyed viewing, or if depth looks inside-out). Live-reloaded.
stereo_swap=0

; ---- Reference marks: true heading/pitch ------------------------------------------------------------
; With head-look turning the view away from the body, it gets hard to tell where an arrow would actually
; fly. Short amber ticks at the screen edges mark it: the ticks on the left/right edges move up/down with
; the body's true pitch, the ticks on the top/bottom edges move left/right with its true heading. Extend
; all four inward and they cross at the point body-forward projects to -- the same direction a projectile
; launches along. On by default (needs enabled=1 and a game restart the first time it is switched on from
; off; turning it back off, or fov_deg, is live).
show_heading_marks=1
; The engine's own field of view, degrees, used only to place the ticks -- GUESS, not read from the game
; (see docs/DEVLOG.md). If the crosshair the ticks would form doesn't line up with where arrows actually land,
; adjust this until it does: that IS the calibration.
fov_deg=90
